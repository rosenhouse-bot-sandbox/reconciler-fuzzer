# This config lists Clusters, Databases and Users, and the references by which
# a Database names its Cluster and the fixture Secret, and a User its
# Database. Fuzz cluster/ or database/ instead: a generated plan here can
# delete a Cluster that a Database names, and the Cluster then waits in
# deletion, which Converge fails. Paths resolve against this file's directory.
launch:
  binary: ../../bin/toy-fleet
  args:
    - --bug=0                      # A later --launch-arg --bug=N wins.
  env:
    KUBECONFIG: ${systems.kube.kubeconfig}
    WATCH_NAMESPACE: ${systems.kube.namespace}
  rbac:
    - rbac/role.yaml
crds:
  - crds/
primaries:
  - kind: toy.reconciler-fuzzer/v1/Cluster
    sample: cluster.yaml
    ready: &ready >-
      has(self.status) && has(self.status.observedGeneration) && self.status.observedGeneration == self.metadata.generation
      && has(self.status.phase) && self.status.phase == 'Ready'
    values: {mutate: [spec.volumes, spec.volumeSize]}
  - kind: toy.reconciler-fuzzer/v1/Database
    sample: database/database.yaml
    ready: *ready
    values: {mutate: [spec.engine, spec.clusterRef, spec.passwordSecretRef]}
  - {kind: toy.reconciler-fuzzer/v1/User, sample: user.yaml, ready: *ready, values: {mutate: [spec.databaseRef]}}
fixtures: [admin-password.yaml]
references:
  - {from: toy.reconciler-fuzzer/v1/Database, to: toy.reconciler-fuzzer/v1/Cluster, name: spec.clusterRef}
  - from: toy.reconciler-fuzzer/v1/Database
    to: v1/Secret
    name: spec.passwordSecretRef.name
    ready: has(self.data) && has(self.data.password)
    track: 1s                      # The Database is ready only while its Secret holds a password.
  - {from: toy.reconciler-fuzzer/v1/User, to: toy.reconciler-fuzzer/v1/Database, name: spec.databaseRef}
models:
  - kind: storage.thirdparty/v1/Volume
    stages: readyCondition
    after: 300ms
    dependency: {track: 1s}
timeouts:
  settle: 10s
  stable: 2s
