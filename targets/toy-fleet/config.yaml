# This config lists Clusters, Databases and Users. Its references say that a
# Database names a Cluster and the fixture Secret, and a User a Database. A
# Cluster's deletion waits for the Databases that name it, and a Database's
# for its Users. Some generated plans stop early, at a create into a name
# that waits in deletion (#189). Fuzz cluster/ or database/ for whole
# plans. Paths resolve against this file's directory.
launch:
  binary: ../../bin/toy-fleet
  args:
    - --bug=0                      # A later --launch-arg --bug=N wins.
  env:
    KUBECONFIG: ${systems.kube.kubeconfig}
    WATCH_NAMESPACE: ${systems.kube.namespace}
  rbac:
    - rbac/role.yaml
crds:
  - crds/
primaries:
  - kind: toy.reconciler-fuzzer/v1/Cluster
    sample: cluster.yaml
    ready: &ready >-
      has(self.status) && has(self.status.observedGeneration) && self.status.observedGeneration == self.metadata.generation
      && has(self.status.phase) && self.status.phase == 'Ready'
    values: {mutate: [spec.volumes, spec.volumeSize]}
  - kind: toy.reconciler-fuzzer/v1/Database
    sample: database/database.yaml
    ready: *ready
    values: {mutate: [spec.engine, spec.clusterRef, spec.passwordSecretRef]}
  - {kind: toy.reconciler-fuzzer/v1/User, sample: user.yaml, ready: *ready, values: {mutate: [spec.databaseRef]}}
fixtures: [admin-password.yaml]
references:
  - {from: toy.reconciler-fuzzer/v1/Database, to: toy.reconciler-fuzzer/v1/Cluster, name: spec.clusterRef, onDelete: block}
  - from: toy.reconciler-fuzzer/v1/Database
    to: v1/Secret
    name: spec.passwordSecretRef.name
    ready: has(self.data) && has(self.data.password)
    track: 1s                      # The Database is ready only while its Secret holds a password.
  - {from: toy.reconciler-fuzzer/v1/User, to: toy.reconciler-fuzzer/v1/Database, name: spec.databaseRef, onDelete: block}
models:
  - kind: storage.thirdparty/v1/Volume
    stages: readyCondition
    after: 300ms
    dependency: {track: 1s}
systems:
  - name: kube
    owner: "self.metadata.labels['fleet.toy/cluster']"   # B160's Volumes have no ownerReference.
    # A Volume's role drops a suffix after its index, so that Unique finds two
    # Volumes of one index. The guard yields '' for every other object, which
    # keeps its default role and raises no error.
    role: >-
      self.kind == 'Volume' && self.metadata.name.matches('-vol-[0-9]+-[^-]+$')
      ? self.metadata.name.substring(0, self.metadata.name.lastIndexOf('-')) : ''
timeouts:
  settle: 10s
  stable: 2s
