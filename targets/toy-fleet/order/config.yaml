# config.yaml with a property that no Volume outlives its Cluster. Paths
# resolve against this file's directory.
launch:
  binary: ../../../bin/toy-fleet
  args:
    - --bug=0                      # A later --launch-arg --bug=N wins.
  env:
    KUBECONFIG: ${systems.kube.kubeconfig}
    WATCH_NAMESPACE: ${systems.kube.namespace}
  rbac:
    - ../rbac/role.yaml
crds:
  - ../crds/
primary:
  kind: toy.reconciler-fuzzer/v1/Cluster
  sample: ../cluster.yaml
  ready: >-
    has(self.status) && has(self.status.observedGeneration) && self.status.observedGeneration == self.metadata.generation
    && has(self.status.phase) && self.status.phase == 'Ready'
models:
  - kind: storage.thirdparty/v1/Volume
    stages: readyCondition
    after: 300ms
    dependency: {track: 1s}
values:
  mutate: [spec.volumes, spec.volumeSize]
properties:
  - name: volumes-go-before-their-cluster
    when: always
    expr: >-
      world.kube['volumes.storage.thirdparty'].all(v, !has(v.metadata.ownerReferences)
      || v.metadata.ownerReferences.all(o, crs.exists(c, c.metadata.uid == o.uid)))
timeouts:
  settle: 10s
  stable: 2s
