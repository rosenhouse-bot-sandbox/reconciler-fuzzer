---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusters.toy.reconciler-fuzzer
spec:
  group: toy.reconciler-fuzzer
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is Pending, then Provisioning until its Volumes are ready, then
          Ready, and Deleting once deleted. It owns spec.volumes Volumes, whose
          third-party controller sets them ready.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              volumeSize:
                description: VolumeSize is each Volume's spec.size.
                enum:
                - small
                - large
                type: string
              volumes:
                description: Volumes is how many Volumes the Cluster owns.
                format: int32
                maximum: 3
                minimum: 1
                type: integer
            required:
            - volumeSize
            - volumes
            type: object
          status:
            properties:
              message:
                description: Message says what the CR waits for.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the controller last
                  acted on.
                format: int64
                type: integer
              phase:
                description: Phase is where a CR is in its lifecycle.
                type: string
              readyVolumes:
                description: ReadyVolumes counts the Volumes ready for their current
                  generation.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
