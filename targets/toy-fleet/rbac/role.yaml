# No volumes/status: the Volume's own controller writes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toy-fleet
rules:
  - apiGroups: ["toy.reconciler-fuzzer"]
    resources: ["clusters", "databases", "users"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["toy.reconciler-fuzzer"]
    resources: ["clusters/status", "databases/status", "users/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["storage.thirdparty"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
