# Proposed (#126): ../config.yaml with primaries and references in place of its properties.
# Paths resolve against this file's directory.
launch:
  binary: ../../../../bin/toy-fleet
  args:
    - --bug=0                      # A later --launch-arg --bug=N wins.
  env:
    KUBECONFIG: ${systems.kube.kubeconfig}
    WATCH_NAMESPACE: ${systems.kube.namespace}
  rbac:
    - ../../rbac/role.yaml
crds:
  - ../../crds/
primaries:
  - kind: toy.reconciler-fuzzer/v1/Cluster
    sample: ../../cluster.yaml
    ready: &ready >-
      has(self.status) && has(self.status.observedGeneration) && self.status.observedGeneration == self.metadata.generation
      && has(self.status.phase) && self.status.phase == 'Ready'
  - {kind: toy.reconciler-fuzzer/v1/Database, sample: ../../database/database.yaml, ready: *ready}
  - {kind: toy.reconciler-fuzzer/v1/User, sample: ../../user/user.yaml, ready: *ready}
models:
  - kind: storage.thirdparty/v1/Volume
    stages: readyCondition
    after: 300ms
    dependency: {track: 1s}
# Generation fills each reference's field with a CR of its `to` kind. Honest
# fails a `from` CR that reports ready before the controller saw its `to` CR
# ready. With onDelete: block, a `to` CR that waits in deletion for its
# `from` CRs counts as settled, and Ordered fails a `to` CR that goes while a
# `from` CR names it. With onDelete: cascade, Ordered fails a `from` CR that
# outlives its `to` CR.
references:
  - from: toy.reconciler-fuzzer/v1/Database
    to: toy.reconciler-fuzzer/v1/Cluster
    name: self.spec.clusterRef
    onDelete: block
  - from: toy.reconciler-fuzzer/v1/User
    to: toy.reconciler-fuzzer/v1/Database
    name: self.spec.databaseRef
    onDelete: block
values:
  mutate: [spec.volumes, spec.volumeSize]
timeouts:
  settle: 10s
  stable: 2s
