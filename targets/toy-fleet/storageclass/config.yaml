# This is cluster/config.yaml with --storage-classes, which gives each
# Cluster a StorageClass. A cluster-scoped object can carry no ownerReference
# to a namespaced Cluster, so an owns entry names it. Paths resolve against
# this file's directory.
launch:
  binary: ../../../bin/toy-fleet
  args:
    - --bug=0                      # A later --launch-arg --bug=N wins.
    - --storage-classes
  env:
    KUBECONFIG: ${systems.kube.kubeconfig}
    WATCH_NAMESPACE: ${systems.kube.namespace}
  rbac:
    - ../rbac/role.yaml
    - role.yaml
crds:
  - ../crds/
primary:
  kind: toy.reconciler-fuzzer/v1/Cluster
  sample: ../cluster.yaml
  ready: >-
    has(self.status) && has(self.status.observedGeneration) && self.status.observedGeneration == self.metadata.generation
    && has(self.status.phase) && self.status.phase == 'Ready'
  owns:
    - {kind: storage.k8s.io/v1/StorageClass, name: "'fleet-' + self.metadata.namespace + '-' + self.metadata.name"}
models:
  - kind: storage.thirdparty/v1/Volume
    stages: readyCondition
    after: 300ms
    dependency: {track: 1s}
values:
  mutate: [spec.volumes, spec.volumeSize]
timeouts:
  settle: 10s
  stable: 2s
