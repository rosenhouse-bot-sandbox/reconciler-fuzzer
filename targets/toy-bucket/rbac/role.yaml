apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toy-bucket
rules:
  - apiGroups: ["toy.reconciler-fuzzer"]
    resources: ["buckets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["toy.reconciler-fuzzer"]
    resources: ["buckets/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toy-bucket
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
