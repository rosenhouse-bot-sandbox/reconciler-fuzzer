apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.rules.reconciler-fuzzer
spec:
  group: rules.reconciler-fuzzer
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name.size() <= 20
              message: the name must fit in 20 characters
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [count, mode]
              x-kubernetes-validations:
                - rule: '!has(self.maxUnavailable) || self.maxUnavailable <= self.count'
                  message: maxUnavailable must not exceed count
                - rule: self.count >= self.minCount
                  message: count must reach minCount
                - rule: '[has(self.left), has(self.right)].exists_one(x, x)'
                  message: exactly one of left and right must be set
                - rule: self.minCount <= oldSelf.minCount
                  message: minCount may not rise
              properties:
                count:
                  type: integer
                  minimum: 0
                  maximum: 10
                maxUnavailable:
                  type: integer
                  minimum: 0
                  maximum: 10
                minCount:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 1
                mode:
                  type: string
                  enum: [fast, safe]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: mode is immutable
                left:
                  type: string
                  maxLength: 8
                right:
                  type: string
                  maxLength: 8
                tags:
                  type: array
                  x-kubernetes-list-type: set
                  maxItems: 3
                  items:
                    type: string
                    maxLength: 8
                config:
                  type: object
                  maxProperties: 3
                  additionalProperties:
                    type: string
                    maxLength: 8
                surge:
                  x-kubernetes-int-or-string: true
                  anyOf:
                    - type: integer
                    - type: string
