# The sample primary CR. refreshPolicy OnChange syncs when the spec changes and
# writes nothing in between, so a settled step stays quiet.
# spec.target leaves creationPolicy and deletionPolicy at the CRD's defaults,
# Owner and Retain, so the Secret carries an ownerReference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example
spec:
  refreshPolicy: OnChange
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: fake
    kind: SecretStore
  target:
    name: example-secret
  data:
    - secretKey: token
      remoteRef:
        key: /token
