# The sample primary CR. refreshPolicy Periodic reads Vault every
# refreshInterval, and writes the Secret when the value changed.
# spec.target leaves creationPolicy and deletionPolicy at the CRD's defaults,
# Owner and Retain, so the Secret carries an ownerReference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example
spec:
  refreshPolicy: Periodic
  refreshInterval: 2s
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: example-secret
  data:
    - secretKey: token
      remoteRef:
        key: token
        property: value
