# The fixtures: an ExternalSecret reads from a SecretStore, and no CRD schema
# can invent a valid secretStoreRef. The store reads the Vault dev server's
# KV version 2 mount with its root token.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: ${systems.vault.url}
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
stringData:
  token: ${systems.vault.token}
