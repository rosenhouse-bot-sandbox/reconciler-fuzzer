# The fixture: an ExternalSecret reads from a SecretStore, and no CRD schema
# can invent a valid secretStoreRef. The fake provider serves two keys, so a
# plan can switch remoteRef.key.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
        - key: /token
          value: s3cr3t
        - key: /other
          value: other-value
