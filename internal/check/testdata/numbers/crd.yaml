apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: things.toy}
spec:
  group: toy
  names: {kind: Thing, plural: things}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size: {type: integer}
                ratio: {type: number}
                peer: {type: string}
