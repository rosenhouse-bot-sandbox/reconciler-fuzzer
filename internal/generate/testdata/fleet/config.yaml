# Clusters and Databases from toy-fleet. Nothing launches this target.
launch:
  binary: none
  rbac: [../../../../targets/toy-fleet/rbac/role.yaml]
crds: [../../../../targets/toy-fleet/crds/]
primaries:
  - kind: toy.reconciler-fuzzer/v1/Cluster
    sample: ../../../../targets/toy-fleet/cluster.yaml
    ready: "true"
    values: {mutate: [spec.volumes, spec.volumeSize]}
  - kind: toy.reconciler-fuzzer/v1/Database
    sample: ../../../../targets/toy-fleet/database/database.yaml
    ready: "true"
    values: {overlay: {spec.clusterRef: {enum: [cluster]}}, mutate: [spec.engine]}
