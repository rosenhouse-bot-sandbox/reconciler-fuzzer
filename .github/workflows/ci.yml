# Lint, unit, envtest, generated and example tiers on every pull request and
# push to main. DESIGN.md §16 names the targets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run. Pushes to main never do.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt
      - run: make vet
      - run: make verify-generate

  # The unit tests include the size test and the bug-matrix check.
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  # The envtest and generated tiers run both toys, toy-widget and toy-bucket.
  # make setup installs Vault and moto, which the envtest tier uses.
  envtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The Makefile pins ENVTEST_K8S_VERSION, so its hash keys the cache.
      - name: Cache envtest control-plane binaries
        uses: actions/cache@v6
        with:
          path: |
            bin/envtest
            bin/setup-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # The venv names the runner's python, so its version joins the key.
      - name: Read the Vault and moto pins
        id: fakes
        run: echo "key=$({ grep -E '^VAULT_' Makefile; cat requirements-moto.txt; python3 --version; } | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Cache Vault and moto
        uses: actions/cache@v6
        with:
          path: |
            bin/vault
            bin/vault-*.installed
            bin/moto
            bin/moto-*.installed
          key: fakes-${{ runner.os }}-${{ steps.fakes.outputs.key }}
      - run: make test-envtest

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest control-plane binaries
        uses: actions/cache@v6
        with:
          path: |
            bin/envtest
            bin/setup-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # The venv names the runner's python, so its version joins the key.
      - name: Read the Vault and moto pins
        id: fakes
        run: echo "key=$({ grep -E '^VAULT_' Makefile; cat requirements-moto.txt; python3 --version; } | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Cache Vault and moto
        uses: actions/cache@v6
        with:
          path: |
            bin/vault
            bin/vault-*.installed
            bin/moto
            bin/moto-*.installed
          key: fakes-${{ runner.os }}-${{ steps.fakes.outputs.key }}
      - run: make test-generated

  # The slowest tier, external-secrets', takes about 12 minutes.
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: cert-manager
            binary: cert-manager-controller
          - example: external-secrets
            binary: external-secrets
          - example: ack-s3
            binary: ack-s3-controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest control-plane binaries
        uses: actions/cache@v6
        with:
          path: |
            bin/envtest
            bin/setup-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      # The venv names the runner's python, so its version joins the key.
      - name: Read the Vault and moto pins
        id: fakes
        run: echo "key=$({ grep -E '^VAULT_' Makefile; cat requirements-moto.txt; python3 --version; } | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Cache Vault and moto
        uses: actions/cache@v6
        with:
          path: |
            bin/vault
            bin/vault-*.installed
            bin/moto
            bin/moto-*.installed
          key: fakes-${{ runner.os }}-${{ steps.fakes.outputs.key }}
      - name: Read the ${{ matrix.example }} pin
        id: pin
        run: echo "version=$(make --no-print-directory ${{ matrix.example }}-version)" >>"$GITHUB_OUTPUT"
      # The stamp tells make the cached binary is current.
      - name: Cache the ${{ matrix.example }} controller
        uses: actions/cache@v6
        with:
          path: |
            bin/${{ matrix.binary }}
            bin/${{ matrix.example }}-${{ steps.pin.outputs.version }}.built
          key: ${{ matrix.example }}-${{ runner.os }}-${{ steps.pin.outputs.version }}
      - run: make test-example-${{ matrix.example }}
      - name: Keep the failing run's evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reconciler-fuzzer-out-${{ matrix.example }}
          path: reconciler-fuzzer-out/
          if-no-files-found: ignore
