# Hunts each example on fresh seeds. It runs apart from CI, so a find never
# blocks a merge.
name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# A dispatch waits for the scheduled run rather than overlap it.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: cert-manager
            binary: cert-manager-controller
          - example: external-secrets
            binary: external-secrets
          - example: ack-s3
            binary: ack-s3-controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest control-plane binaries
        uses: actions/cache@v6
        with:
          path: |
            bin/envtest
            bin/setup-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Read the Vault and moto pins
        id: fakes
        run: echo "key=$({ grep -E '^VAULT_' Makefile; cat requirements-moto.txt; python3 --version; } | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Cache Vault and moto
        uses: actions/cache@v6
        with:
          path: |
            bin/vault
            bin/vault-*.installed
            bin/moto
            bin/moto-*.installed
          key: fakes-${{ runner.os }}-${{ steps.fakes.outputs.key }}
      - name: Read the ${{ matrix.example }} pin
        id: pin
        run: echo "version=$(make --no-print-directory ${{ matrix.example }}-version)" >>"$GITHUB_OUTPUT"
      - name: Cache the ${{ matrix.example }} controller
        uses: actions/cache@v6
        with:
          path: |
            bin/${{ matrix.binary }}
            bin/${{ matrix.example }}-${{ steps.pin.outputs.version }}.built
          key: ${{ matrix.example }}-${{ runner.os }}-${{ steps.pin.outputs.version }}
      # make exits 2 on any failure, so the hunt's own exit code, 1 on a find
      # and 2 on an error, comes from exit-status. Without that file, make
      # failed before the hunt ran.
      - name: Hunt ${{ matrix.example }}
        id: hunt
        run: |
          make hunt-${{ matrix.example }} || true
          status=$(cat reconciler-fuzzer-out/hunt-${{ matrix.example }}/exit-status 2>/dev/null || echo 2)
          echo "status=$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Show the hunt's summary
        if: always()
        run: cat reconciler-fuzzer-out/hunt-${{ matrix.example }}/summary.md >>"$GITHUB_STEP_SUMMARY" || true
      - name: Keep the hunt's output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconciler-fuzzer-out-${{ matrix.example }}
          path: reconciler-fuzzer-out/
          if-no-files-found: ignore
      # One open issue per example and verdict collects the reports, so a hunt
      # that keeps failing comments instead of filing again. The label is the
      # key, because an in:title search can miss.
      - name: Report the failure
        if: failure() && steps.hunt.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXAMPLE: ${{ matrix.example }}
          STATUS: ${{ steps.hunt.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = 1 ]; then
            LABEL="nightly-find-$EXAMPLE"
            TITLE="Nightly: the $EXAMPLE hunt found something"
            DESC="A find from the nightly $EXAMPLE hunt"
          else
            LABEL="nightly-error-$EXAMPLE"
            TITLE="Nightly: the $EXAMPLE hunt hit an error"
            DESC="An error from the nightly $EXAMPLE hunt"
          fi
          body=$(cat <<EOF
          🤖 Created by Claude 🤖

          \`make hunt-$EXAMPLE\` exited $STATUS on $(date -u +%Y-%m-%d).

          - Run: $RUN_URL
          - Fetch its output: \`gh run download $GITHUB_RUN_ID --name reconciler-fuzzer-out-$EXAMPLE --dir reconciler-fuzzer-out\`
          - Replay a failing seed: run \`make build $EXAMPLE\` and \`export KUBEBUILDER_ASSETS=\$(make -s assets-path)\`, then \`./bin/reconciler-fuzzer run --config examples/$EXAMPLE/config.yaml --plan reconciler-fuzzer-out/hunt-$EXAMPLE/seed-<n>/plan.json --out replay\`. summary.md names the failing seeds and each shrunk plan, which replays the same way.
          EOF
          )
          gh label create "$LABEL" --description "$DESC" --color B60205 --force
          open=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
